# QuestBoard - daily quests
# Each player gets `quests-per-day` quests picked from the pool below, rotating at midnight server time.
# Completing every quest in a day counts toward a streak. Streak bonus commands fire at the listed milestones.

quests-per-day: 3
free-rerolls-per-day: 1

# %player% is replaced with the player's name in every command.
# Rewards: xp = vanilla xp levels, commands = run from console.
quests:
  - id: stone_miner
    name: "Stone Miner"
    type: MINE
    target: STONE
    amount: 128
    xp: 5
    commands: ["give %player% iron_ingot 8"]
  - id: deep_ores
    name: "Deep Ores"
    type: MINE
    target: DIAMOND_ORE,DEEPSLATE_DIAMOND_ORE
    amount: 6
    xp: 15
    commands: ["give %player% diamond 2"]
  - id: coal_run
    name: "Coal Run"
    type: MINE
    target: COAL_ORE,DEEPSLATE_COAL_ORE
    amount: 48
    xp: 6
    commands: ["give %player% torch 32"]
  - id: lumberjack
    name: "Lumberjack"
    type: MINE
    target: OAK_LOG,BIRCH_LOG,SPRUCE_LOG,JUNGLE_LOG,ACACIA_LOG,DARK_OAK_LOG,MANGROVE_LOG,CHERRY_LOG
    amount: 64
    xp: 5
    commands: ["give %player% golden_apple 2"]
  - id: zombie_slayer
    name: "Zombie Slayer"
    type: KILL
    target: ZOMBIE
    amount: 20
    xp: 8
    commands: ["give %player% iron_sword 1"]
  - id: skeleton_hunter
    name: "Skeleton Hunter"
    type: KILL
    target: SKELETON
    amount: 15
    xp: 8
    commands: ["give %player% arrow 32"]
  - id: creeper_sweeper
    name: "Creeper Sweeper"
    type: KILL
    target: CREEPER
    amount: 8
    xp: 10
    commands: ["give %player% tnt 4"]
  - id: spider_squasher
    name: "Spider Squasher"
    type: KILL
    target: SPIDER,CAVE_SPIDER
    amount: 12
    xp: 8
    commands: ["give %player% string 16"]
  - id: enderman_hunt
    name: "Enderman Hunt"
    type: KILL
    target: ENDERMAN
    amount: 4
    xp: 15
    commands: ["give %player% ender_pearl 4"]
  - id: any_hostile
    name: "Monster Purge"
    type: KILL
    target: ANY_HOSTILE
    amount: 40
    xp: 12
    commands: ["give %player% diamond 1"]
  - id: builder
    name: "Builder"
    type: PLACE
    target: ANY
    amount: 200
    xp: 6
    commands: ["give %player% bricks 32"]
  - id: fisherman
    name: "Gone Fishing"
    type: FISH
    target: ANY
    amount: 10
    xp: 7
    commands: ["give %player% cooked_salmon 8"]
  - id: chef
    name: "Chef"
    type: CRAFT
    target: BREAD,COOKIE,CAKE,PUMPKIN_PIE
    amount: 16
    xp: 6
    commands: ["give %player% cake 1"]
  - id: toolsmith
    name: "Toolsmith"
    type: CRAFT
    target: IRON_PICKAXE,IRON_AXE,IRON_SHOVEL,IRON_SWORD,IRON_HOE
    amount: 3
    xp: 8
    commands: ["give %player% iron_ingot 12"]
  - id: explorer
    name: "Explorer"
    type: WALK
    target: ANY
    amount: 2000
    xp: 8
    commands: ["give %player% map 1", "give %player% compass 1"]
  - id: farmer
    name: "Farmer"
    type: MINE
    target: WHEAT,CARROTS,POTATOES,BEETROOTS
    amount: 64
    xp: 5
    commands: ["give %player% bone_meal 16"]

# Fires once when a player completes every quest for the day.
daily-complete-commands: ["give %player% emerald 3"]

# Streak milestones: consecutive days with all quests done.
streak-rewards:
  3: ["give %player% diamond 3"]
  7: ["give %player% netherite_scrap 2", "give %player% diamond 5"]
  14: ["give %player% netherite_ingot 1"]
  30: ["give %player% elytra 1"]
